name: Promote product boot once

on:
  push:
    branches:
      - refactor/product-boot-retirement
    paths:
      - scripts/promote-product-boot-once.js
      - .github/workflows/promote-product-boot-once.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate migration script
        run: node --check scripts/promote-product-boot-once.js
      - name: Promote product boot ownership
        run: node scripts/promote-product-boot-once.js
      - name: Run full test suite
        run: npm test
      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: retire product boot compatibility"
          git push
# rerun after canonical product-init contract update
