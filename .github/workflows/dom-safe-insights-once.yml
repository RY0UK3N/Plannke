name: Make insights DOM-safe once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  dom-safe-insights:
    if: github.head_ref == 'security/dom-safe-insights'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dom-safe-insights
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Convert Insights renderer
        run: node scripts/dom-safe-insights-once.js
      - name: Validate repository
        run: npm test
      - name: Commit DOM-safe Insights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Render insights with DOM APIs"
          git push origin HEAD:security/dom-safe-insights
