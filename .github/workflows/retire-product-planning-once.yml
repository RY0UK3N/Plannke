name: Retire legacy planning once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  retire-planning:
    if: github.head_ref == 'refactor/retire-legacy-runtime-copies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-legacy-runtime-copies
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Retire legacy planning runtime
        run: node scripts/retire-product-planning-once.js
      - name: Validate repository
        run: npm test
      - name: Commit cleaned runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Retire legacy planning runtime from product layer"
          git push origin HEAD:refactor/retire-legacy-runtime-copies
