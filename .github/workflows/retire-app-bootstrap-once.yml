name: Retire legacy app bootstrap once

on:
  push:
    branches:
      - feature/storage-adapter-autosave
    paths:
      - '.github/workflows/retire-app-bootstrap-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storage-adapter-autosave
          fetch-depth: 0
      - name: Remove retired bootstrap and persistence hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          source = app.read_text(encoding='utf-8')
          original = source

          source = source.replace("document.addEventListener('DOMContentLoaded', () => { initApp(); });\n\n", '', 1)
          source = source.replace("let _backupDone = false;\n", '', 1)
          source = source.replace("    loadFromLocalStorage();\n    checkImportPrompt();\n    setupBeforeUnload();\n", '', 1)

          start = "/* ============================================================\n   PERSISTÊNCIA — localStorage (autosave) + prompts\n   ============================================================ */"
          end = "/* ============================================================\n   CAMPO DE VALOR FORMATADO (R$ 0,00)\n   ============================================================ */"
          if start not in source or end not in source:
              raise SystemExit('Expected legacy persistence block markers were not found')
          before, rest = source.split(start, 1)
          _, after = rest.split(end, 1)
          source = before.rstrip() + "\n\n" + end + after

          if source == original:
              raise SystemExit('app.js was not changed')
          for forbidden in ['planner_autosave', 'planner_session_cache', 'checkImportPrompt()', 'setupBeforeUnload()', 'loadFromLocalStorage()']:
              if forbidden in source:
                  raise SystemExit(f'Retired bootstrap token still present in app.js: {forbidden}')
          app.write_text(source, encoding='utf-8')

          adapter = Path('storage-adapter.js')
          adapter_source = adapter.read_text(encoding='utf-8')
          for line in [
              "    root.loadFromLocalStorage = function () { return coordinator.initialize(); };\n",
              "    root.setupBeforeUnload = function () { coordinator.installLifecycleHandlers(); };\n",
              "    root.checkImportPrompt = function () {};\n",
          ]:
              adapter_source = adapter_source.replace(line, '')
          adapter.write_text(adapter_source, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/retire-app-bootstrap-once.yml
          git config user.name "plannke-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js storage-adapter.js .github/workflows/retire-app-bootstrap-once.yml
          git commit -m "Retire legacy application bootstrap"
          git push origin HEAD:feature/storage-adapter-autosave
