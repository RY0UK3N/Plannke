name: Retire app movements once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  retire-movements:
    if: github.head_ref == 'refactor/retire-app-movement-copies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-app-movement-copies
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Retire legacy movement runtime
        run: node scripts/retire-app-movements-once.js
      - name: Validate repository
        run: npm test
      - name: Commit cleaned runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Retire legacy movement runtime from app monolith"
          git push origin HEAD:refactor/retire-app-movement-copies
