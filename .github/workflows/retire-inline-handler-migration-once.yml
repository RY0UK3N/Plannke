name: Retire inline handler migration once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  retire-inline-handler-migration:
    if: github.head_ref == 'refactor/retire-inline-handler-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-inline-handler-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Retire inline handler migration
        run: node scripts/retire-inline-handler-migration-once.js
      - name: Validate repository
        run: npm test
      - name: Commit static compatibility actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Retire inline handler migration"
          git push origin HEAD:refactor/retire-inline-handler-migration
