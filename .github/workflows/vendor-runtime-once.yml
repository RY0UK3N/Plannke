name: Vendor runtime once

on:
  push:
    branches:
      - feature/desktop-tablet-revamp
    paths:
      - .github/workflows/vendor-runtime-once.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revamp branch
        uses: actions/checkout@v4
        with:
          ref: feature/desktop-tablet-revamp
          fetch-depth: 0

      - name: Download pinned runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/licenses

          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css \
            -o vendor/bootstrap.min.css
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js \
            -o vendor/bootstrap.bundle.min.js
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css \
            -o vendor/phosphor-icons.css
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js \
            -o vendor/xlsx.full.min.js
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js \
            -o vendor/chart.umd.min.js
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js \
            -o vendor/echarts.min.js

          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/LICENSE \
            -o vendor/licenses/bootstrap-MIT.txt
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/LICENSE \
            -o vendor/licenses/phosphor-icons-MIT.txt
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/chart.js@4.5.1/LICENSE.md \
            -o vendor/licenses/chartjs-MIT.txt
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.jsdelivr.net/npm/echarts@5.4.3/LICENSE \
            -o vendor/licenses/echarts-Apache-2.0.txt
          curl --fail --location --retry 3 --silent --show-error \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/LICENSE \
            -o vendor/licenses/sheetjs-Apache-2.0.txt

      - name: Point application shell at local assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Phosphor CSS is local, while the font files remain on the pinned CDN.
          # This removes remote stylesheet execution without copying font binaries.
          phosphor = Path('vendor/phosphor-icons.css')
          css = phosphor.read_text(encoding='utf-8')
          for filename in ('Phosphor.woff2', 'Phosphor.woff', 'Phosphor.ttf', 'Phosphor.svg#Phosphor'):
              css = css.replace(
                  f'url("./{filename}")',
                  f'url("https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/{filename}")'
              )
          phosphor.write_text(css, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          csp = (
              "default-src 'self'; script-src 'self'; style-src 'self'; "
              "style-src-attr 'unsafe-inline'; font-src 'self' data: https://cdn.jsdelivr.net; "
              "img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; "
              "manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
          )
          html, count = re.subn(
              r'content="default-src \'self\'; script-src [^"]+?form-action \'self\';"',
              f'content="{csp}"',
              html,
              count=1
          )
          if count != 1:
              raise SystemExit('CSP meta tag was not updated')

          replacements = {
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css': 'vendor/bootstrap.min.css',
              'https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css': 'vendor/phosphor-icons.css',
              'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js': 'vendor/bootstrap.bundle.min.js',
              'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js': 'vendor/xlsx.full.min.js',
              'https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js': 'vendor/chart.umd.min.js',
              'https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js': 'vendor/echarts.min.js',
          }
          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'missing expected dependency URL: {old}')
              html = html.replace(old, new)

          html, count = re.subn(
              r'\s*<link href="https://fonts\.googleapis\.com/css2\?family=Inter:[^\"]+"\s*\n\s*rel="stylesheet">',
              '',
              html,
              count=1
          )
          if count != 1:
              raise SystemExit('Google Fonts link was not removed')
          index.write_text(html, encoding='utf-8')

          styles = Path('styles.css')
          source = styles.read_text(encoding='utf-8')
          source, count = re.subn(
              r"@import url\('https://fonts\.googleapis\.com/css2\?family=Inter:[^']+'\);\s*",
              '',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit('Google Fonts @import was not removed')
          source = source.replace(
              "font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;",
              'font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;'
          )
          source = source.replace(
              "font-family: 'Inter', sans-serif;",
              'font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;'
          )
          styles.write_text(source, encoding='utf-8')

          sw = Path('sw.js')
          worker = sw.read_text(encoding='utf-8')
          if "plannke-shell-v14" not in worker:
              raise SystemExit('unexpected service worker cache version')
          worker = worker.replace("plannke-shell-v14", "plannke-shell-v15", 1)
          marker = "  './styles.css',\n"
          assets = ''.join([
              "  './vendor/bootstrap.min.css',\n",
              "  './vendor/bootstrap.bundle.min.js',\n",
              "  './vendor/phosphor-icons.css',\n",
              "  './vendor/xlsx.full.min.js',\n",
              "  './vendor/chart.umd.min.js',\n",
              "  './vendor/echarts.min.js',\n",
          ])
          if './vendor/bootstrap.min.css' not in worker:
              worker = worker.replace(marker, marker + assets, 1)
          sw.write_text(worker, encoding='utf-8')

          security = Path('tests/security-shell.test.js')
          test_source = security.read_text(encoding='utf-8')

          def replace_test(source, title, replacement):
              start_token = f"test('{title}'"
              start = source.find(start_token)
              if start < 0:
                  raise SystemExit(f'missing test block: {title}')
              next_test = source.find("\ntest('", start + len(start_token))
              end = len(source) if next_test < 0 else next_test + 1
              return source[:start] + replacement.rstrip() + "\n\n" + source[end:]

          test_source = replace_test(
              test_source,
              'third-party JavaScript dependencies are version-pinned and consolidated',
              r'''test('third-party runtime dependencies are vendored and pinned', () => {
            const assets = [
              'vendor/bootstrap.min.css',
              'vendor/bootstrap.bundle.min.js',
              'vendor/phosphor-icons.css',
              'vendor/xlsx.full.min.js',
              'vendor/chart.umd.min.js',
              'vendor/echarts.min.js'
            ];
            assets.forEach(asset => assert.ok(fs.existsSync(path.join(root, asset)), `missing vendored asset: ${asset}`));
            assert.match(index, /href="vendor\/bootstrap\.min\.css"/);
            assert.match(index, /href="vendor\/phosphor-icons\.css"/);
            assert.match(index, /src="vendor\/bootstrap\.bundle\.min\.js"/);
            assert.match(index, /src="vendor\/xlsx\.full\.min\.js"/);
            assert.match(index, /src="vendor\/chart\.umd\.min\.js"/);
            assert.match(index, /src="vendor\/echarts\.min\.js"/);
            assert.doesNotMatch(index, /xlsx@0\.18\.5/);
            assert.doesNotMatch(index, /fonts\.googleapis\.com/);
          });'''
          )

          test_source = replace_test(
              test_source,
              'application shell blocks inline script execution',
              r'''test('application shell uses local scripts and scopes inline style compatibility', () => {
            const match = index.match(/<meta http-equiv="Content-Security-Policy"\s+content="([^"]+)"/);
            assert.ok(match, 'CSP meta tag should exist');
            const policy = match[1];
            assert.match(policy, /default-src 'self'/);
            assert.match(policy, /script-src 'self'/);
            assert.match(policy, /style-src 'self'/);
            assert.match(policy, /style-src-attr 'unsafe-inline'/);
            assert.match(policy, /font-src 'self' data: https:\/\/cdn\.jsdelivr\.net/);
            assert.match(policy, /connect-src 'self'/);
            assert.match(policy, /object-src 'none'/);
            assert.match(policy, /base-uri 'self'/);
            assert.match(policy, /form-action 'self'/);
            const scriptPolicy = policy.match(/script-src[^;]*/)?.[0] || '';
            assert.equal(scriptPolicy.trim(), "script-src 'self'");
            assert.doesNotMatch(scriptPolicy, /'unsafe-inline'/);
            assert.doesNotMatch(scriptPolicy, /'unsafe-eval'/);
            assert.doesNotMatch(policy, /fonts\.googleapis\.com|fonts\.gstatic\.com/);
          });'''
          )

          test_source = replace_test(
              test_source,
              'all external resources are limited to approved hosts',
              r'''test('index has no external scripts or stylesheets after vendoring', () => {
            assert.deepEqual(externalUrls(index), []);
            const phosphor = fs.readFileSync(path.join(root, 'vendor/phosphor-icons.css'), 'utf8');
            assert.match(phosphor, /cdn\.jsdelivr\.net\/npm\/@phosphor-icons\/web@2\.1\.2\/src\/regular\/Phosphor\.woff2/);
          });'''
          )

          test_source = replace_test(
              test_source,
              'PWA navigation is network-first and all revamp assets are cached',
              r'''test('PWA navigation is network-first and local runtime assets are cached', () => {
            assert.match(sw, /CACHE_NAME = 'plannke-shell-v15'/);
            assert.match(sw, /event\.request\.mode === 'navigate'/);
            const navigationBlock = sw.slice(sw.indexOf("event.request.mode === 'navigate'"), sw.indexOf("if (url.origin === self.location.origin)"));
            assert.ok(navigationBlock.indexOf('fetch(event.request)') < navigationBlock.indexOf("caches.match('./index.html')"));
            [
              'product-core.js', 'product.js', 'insights.js', 'ui-bridge.js', 'safe-renderers.js',
              'revamp.js', 'revamp.css', 'revamp-dashboard.css', 'revamp-movements.css',
              'revamp-planning.css', 'revamp-accounts.css', 'revamp-forms.css', 'revamp-states.css',
              'vendor/bootstrap.min.css', 'vendor/bootstrap.bundle.min.js', 'vendor/phosphor-icons.css',
              'vendor/xlsx.full.min.js', 'vendor/chart.umd.min.js', 'vendor/echarts.min.js'
            ].forEach(asset => assert.ok(sw.includes(asset), `missing PWA asset: ${asset}`));
          });'''
          )
          security.write_text(test_source, encoding='utf-8')

          vendor_test = Path('tests/vendor-runtime.test.js')
          vendor_test.write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          const root = path.resolve(__dirname, '..');
          const vendor = path.join(root, 'vendor');

          test('vendored runtime versions are the reviewed pinned releases', () => {
            const bootstrapCss = fs.readFileSync(path.join(vendor, 'bootstrap.min.css'), 'utf8');
            const bootstrapJs = fs.readFileSync(path.join(vendor, 'bootstrap.bundle.min.js'), 'utf8');
            const sheetjs = fs.readFileSync(path.join(vendor, 'xlsx.full.min.js'), 'utf8');
            const chart = fs.readFileSync(path.join(vendor, 'chart.umd.min.js'), 'utf8');
            const echarts = fs.readFileSync(path.join(vendor, 'echarts.min.js'), 'utf8');
            assert.match(bootstrapCss, /Bootstrap\s+v5\.3\.3/);
            assert.match(bootstrapJs, /Bootstrap\s+v5\.3\.3/);
            assert.ok(sheetjs.includes('0.20.3'), 'SheetJS 0.20.3 marker missing');
            assert.ok(chart.includes('4.5.1'), 'Chart.js 4.5.1 marker missing');
            assert.ok(echarts.includes('5.4.3'), 'ECharts 5.4.3 marker missing');
          });

          test('vendor manifest matches the committed runtime and license files', () => {
            const manifest = fs.readFileSync(path.join(vendor, 'manifest.sha384'), 'utf8').trim().split(/\n+/);
            assert.ok(manifest.length >= 10);
            manifest.forEach(line => {
              const match = line.match(/^([a-f0-9]{96})\s+(.+)$/);
              assert.ok(match, `invalid manifest line: ${line}`);
              const relative = match[2].replace(/^\.\//, '');
              const bytes = fs.readFileSync(path.join(vendor, relative));
              const actual = crypto.createHash('sha384').update(bytes).digest('hex');
              assert.equal(actual, match[1], `hash mismatch for ${relative}`);
            });
          });
          ''', encoding='utf-8')
          PY

          cat > vendor/README.md <<'EOF'
          # Vendored runtime dependencies

          These files are committed locally so Plannke does not execute third-party JavaScript from a CDN at runtime.

          - Bootstrap 5.3.3 — CSS + bundle JS — MIT — source: jsDelivr npm mirror
          - Phosphor Icons Web 2.1.2 — regular CSS only — MIT — source: jsDelivr npm mirror
          - SheetJS CE 0.20.3 — full browser build — Apache-2.0 — source: official SheetJS CDN
          - Chart.js 4.5.1 — UMD browser build — MIT — source: jsDelivr npm mirror
          - Apache ECharts 5.4.3 — browser build — Apache-2.0 — source: jsDelivr npm mirror

          Phosphor font binaries remain on the exact-version jsDelivr URL referenced by `phosphor-icons.css`. No third-party JavaScript or stylesheet is executed remotely.
          EOF

          (cd vendor && find . -type f ! -name manifest.sha384 -print0 | sort -z | xargs -0 sha384sum > manifest.sha384)

          grep -q '0.20.3' vendor/xlsx.full.min.js
          grep -q 'Bootstrap  v5.3.3' vendor/bootstrap.min.css
          grep -q '5.4.3' vendor/echarts.min.js

      - name: Run test suite
        run: npm test

      - name: Commit vendored runtime and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/vendor-runtime-once.yml
          git add index.html styles.css sw.js tests/security-shell.test.js tests/vendor-runtime.test.js vendor/
          git commit -m 'Vendor runtime dependencies and harden CSP'
          git push origin HEAD:feature/desktop-tablet-revamp
