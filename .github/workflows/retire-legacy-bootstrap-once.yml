name: Retire legacy bootstrap once

on:
  push:
    branches:
      - feature/storage-adapter-autosave
    paths:
      - '.github/workflows/retire-legacy-bootstrap-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storage-adapter-autosave
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove dead legacy bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          app_path = root / 'app.js'
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("document.addEventListener('DOMContentLoaded', () => { initApp(); });\n\n", '', 1)
          app = app.replace("    loadFromLocalStorage();\n    checkImportPrompt();\n    setupBeforeUnload();\n", '', 1)
          pattern = re.compile(
              r"/\* ============================================================\n"
              r"   PERSISTÊNCIA — localStorage \(autosave\) \+ prompts\n"
              r"   ============================================================ \*/.*?"
              r"(?=/\* ============================================================\n"
              r"   CAMPO DE VALOR FORMATADO \(R\$ 0,00\)\n)",
              re.S,
          )
          app, count = pattern.subn('', app, count=1)
          if count != 1:
              raise SystemExit('legacy persistence block not found exactly once')
          app_path.write_text(app, encoding='utf-8')

          bridge_path = root / 'ui-bridge.js'
          bridge = bridge_path.read_text(encoding='utf-8')
          old = """        const start = () => api.init();
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
        else start();
"""
          new = """        let applicationStarted = false;
        const startApplication = () => {
            if (applicationStarted) return;
            applicationStarted = true;
            api.init();
            if (typeof root?.initApp === 'function') root.initApp();
        };
        api.startApplication = startApplication;
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startApplication, { once: true });
        else startApplication();
"""
          if old not in bridge:
              raise SystemExit('ui-bridge start anchor not found')
          bridge = bridge.replace(old, new, 1)
          bridge_path.write_text(bridge, encoding='utf-8')

          package_path = root / 'package.json'
          package_text = package_path.read_text(encoding='utf-8')
          package_text = package_text.replace('node --check storage.js && ', 'node --check storage.js && node --check app.js && ', 1)
          package_path.write_text(package_text, encoding='utf-8')

          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8').replace("plannke-shell-v25", "plannke-shell-v26")
          sw_path.write_text(sw, encoding='utf-8')

          test_path = root / 'tests/legacy-runtime.test.js'
          test_path.write_text(r'''const test = require('node:test');
const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

const root = path.resolve(__dirname, '..');
const app = fs.readFileSync(path.join(root, 'app.js'), 'utf8');
const bridge = fs.readFileSync(path.join(root, 'ui-bridge.js'), 'utf8');
const storage = fs.readFileSync(path.join(root, 'storage.js'), 'utf8');
const sw = fs.readFileSync(path.join(root, 'sw.js'), 'utf8');

test('app.js no longer owns persistence or its own application bootstrap', () => {
  assert.doesNotMatch(app, /document\.addEventListener\('DOMContentLoaded', \(\) => \{ initApp\(\); \}\)/);
  assert.doesNotMatch(app, /function loadFromLocalStorage\(/);
  assert.doesNotMatch(app, /function checkImportPrompt\(/);
  assert.doesNotMatch(app, /function setupBeforeUnload\(/);
  assert.doesNotMatch(app, /patchSaveData/);
  assert.doesNotMatch(app, /const LS_KEY = 'planner_autosave'/);
  assert.doesNotMatch(app, /beforeunload/);
});

test('ui bridge is the single application bootstrap and waits through wrapped initApp', () => {
  assert.match(bridge, /let applicationStarted = false/);
  assert.match(bridge, /const startApplication = \(\) => \{/);
  assert.match(bridge, /api\.init\(\);/);
  assert.match(bridge, /root\.initApp\(\)/);
  assert.match(bridge, /document\.addEventListener\('DOMContentLoaded', startApplication/);
  assert.match(bridge, /return storageReady[\s\S]*legacyInitApp\.apply/);
});

test('finance core and application UI do not duplicate durable browser persistence', () => {
  assert.doesNotMatch(storage, /sessionStorage|localStorage|planner_autosave|planner_session_cache/);
  assert.doesNotMatch(storage, /FileReader|hardenedImportFromExcel/);
});

test('PWA cache advances with the runtime bootstrap refactor', () => {
  assert.match(sw, /CACHE_NAME = 'plannke-shell-v26'/);
});
''', encoding='utf-8')

          workflow = root / '.github/workflows/retire-legacy-bootstrap-once.yml'
          workflow.unlink()
          PY

          npm test

          if git diff --quiet; then
            echo 'No changes produced'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: retire legacy application bootstrap'
          git push origin HEAD:feature/storage-adapter-autosave
