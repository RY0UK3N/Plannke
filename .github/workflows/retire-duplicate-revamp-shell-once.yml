name: Retire duplicate revamp shell once

on:
  push:
    branches:
      - refactor/presentation-shell-boundary

permissions:
  contents: write

jobs:
  retire-duplicate-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/presentation-shell-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Retire duplicate shell construction
        run: node scripts/retire-duplicate-revamp-shell-once.js
      - name: Validate repository
        run: npm test
      - name: Commit presentation boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make revamp presentation-only"
          git push origin HEAD:refactor/presentation-shell-boundary
