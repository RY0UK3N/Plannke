name: Promote product ledger once

on:
  push:
    branches:
      - refactor/product-ledger-retirement
    paths:
      - scripts/promote-product-ledger-once.js
      - .github/workflows/promote-product-ledger-once.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tighten ProductCore migration anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/promote-product-ledger-once.js')
          s = p.read_text()
          old = "core = replaceOnce(core, '    return {\\n', `${coreHelpers}\\n\\n    return {\\n`, 'product core return');"
          new = "core = replaceOnce(core, '    return {\\n        DAY_MS,\\n', `${coreHelpers}\\n\\n    return {\\n        DAY_MS,\\n`, 'product core return');"
          if s.count(old) != 1:
              raise SystemExit(f'expected one generic core anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Validate migration script
        run: node --check scripts/promote-product-ledger-once.js
      - name: Promote product ledger ownership
        run: node scripts/promote-product-ledger-once.js
      - name: Run full test suite
        run: npm test
      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: retire product ledger compatibility"
          git push
