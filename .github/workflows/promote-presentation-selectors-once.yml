name: Promote presentation selectors once

on:
  push:
    branches:
      - refactor/promote-presentation-selectors

permissions:
  contents: write

jobs:
  promote-presentation-selectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/promote-presentation-selectors
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply selector namespace migration
        run: node scripts/promote-presentation-selectors-once.js
      - name: Run repository tests
        run: npm test
      - name: Commit selector namespace migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: promote presentation selector namespace"
          git push origin HEAD:refactor/promote-presentation-selectors
