name: Extract app boot once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  extract-app-boot:
    if: github.head_ref == 'refactor/extract-app-boot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-app-boot
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract application boot
        run: node scripts/extract-app-boot-once.js
      - name: Validate repository
        run: npm test
      - name: Commit extracted boot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract canonical application boot"
          git push origin HEAD:refactor/extract-app-boot
