name: Retire product runtime once

on:
  push:
    branches:
      - refactor/retire-product-runtime
    paths:
      - scripts/retire-product-runtime-once.js
      - .github/workflows/retire-product-runtime-once.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate migration script
        run: node --check scripts/retire-product-runtime-once.js
      - name: Retire final product runtime
        run: node scripts/retire-product-runtime-once.js
      - name: Run full test suite
        run: npm test
      - name: Verify retirement scope
        run: |
          test ! -e product.js
          test ! -e scripts/retire-product-runtime-once.js
          test ! -e .github/workflows/retire-product-runtime-once.yml
          grep -qx "const CACHE_NAME = 'plannke-shell-v39';" sw.js
          ! grep -Fq "'./product.js'" sw.js
          ! grep -Fq "node --check product.js" package.json
          ! grep -R -Fq "product.js" tests
          git diff --quiet -- product-core.js product.css
      - name: Commit validated retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: retire product compatibility runtime"
          git push
