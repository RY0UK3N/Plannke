name: Retire product runtime once

on:
  push:
    branches:
      - refactor/retire-product-runtime
    paths:
      - scripts/retire-product-runtime-once.js
      - .github/workflows/retire-product-runtime-once.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix dashboard migration anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/retire-product-runtime-once.js')
          s = p.read_text()
          old = "  '    function safeRenderDashboard(data) {\\n        const month = localToday().slice(0, 7);\\n        const monthly = (data.transactions || []).filter(tx => String(tx.date || \\\'\\\').startsWith(month));\\n',"
          new = '''  "    function safeRenderDashboard(data) {\\n        const month = localToday().slice(0, 7);\\n        const monthly = (data.transactions || []).filter(tx => String(tx.date || '').startsWith(month));\\n",'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one escaped dashboard anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Validate migration script
        run: node --check scripts/retire-product-runtime-once.js
      - name: Retire final product runtime
        run: node scripts/retire-product-runtime-once.js
      - name: Run full test suite
        run: npm test
      - name: Commit validated retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: retire product compatibility runtime"
          git push
