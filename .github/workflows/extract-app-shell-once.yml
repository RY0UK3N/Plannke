name: Extract app shell once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  extract-app-shell:
    if: github.head_ref == 'refactor/extract-app-shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-app-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract canonical desktop shell
        run: node scripts/extract-app-shell-once.js
      - name: Validate repository
        run: npm test
      - name: Commit extracted shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract canonical desktop shell"
          git push origin HEAD:refactor/extract-app-shell
