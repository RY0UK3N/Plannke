name: Promote presentation stylesheets once

on:
  push:
    branches:
      - refactor/promote-presentation-stylesheets

permissions:
  contents: write

jobs:
  promote-presentation-stylesheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/promote-presentation-stylesheets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply stylesheet rename
        run: node scripts/promote-presentation-stylesheets-once.js
      - name: Run repository tests
        run: npm test
      - name: Commit stylesheet rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: promote presentation stylesheet names"
          git push origin HEAD:refactor/promote-presentation-stylesheets
