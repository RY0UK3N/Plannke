name: Install app actions once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  install-app-actions:
    if: github.head_ref == 'refactor/canonical-action-router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-action-router
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install canonical action router
        run: node scripts/install-app-actions-once.js
      - name: Validate repository
        run: npm test
      - name: Commit canonical action router
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Install canonical action router"
          git push origin HEAD:refactor/canonical-action-router
