name: Bind dashboard controls once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  bind-dashboard-controls:
    if: github.head_ref == 'refactor/dashboard-explicit-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dashboard-explicit-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bind dashboard controls explicitly
        run: node scripts/bind-dashboard-controls-once.js
      - name: Validate repository
        id: validate
        continue-on-error: true
        run: npm test > dashboard-test-output.txt 2>&1
      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-test-output
          path: dashboard-test-output.txt
      - name: Fail when validation failed
        if: steps.validate.outcome != 'success'
        run: exit 1
      - name: Commit explicit dashboard controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bind dashboard controls explicitly"
          git push origin HEAD:refactor/dashboard-explicit-controls
