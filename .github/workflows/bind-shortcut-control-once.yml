name: Bind shortcut control once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  bind-shortcut-control:
    if: github.head_ref == 'refactor/shortcut-explicit-control'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shortcut-explicit-control
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/bind-shortcut-control-once.js
      - run: npm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bind shortcut control explicitly"
          git push origin HEAD:refactor/shortcut-explicit-control
