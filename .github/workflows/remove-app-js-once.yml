name: Remove app.js once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  remove-app-js:
    if: github.head_ref == 'refactor/remove-app-js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-app-js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove retired app.js
        run: node scripts/remove-app-js-once.js
      - name: Validate repository
        run: npm test
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove retired app.js"
          git push origin HEAD:refactor/remove-app-js
