name: Bind transaction controls once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  bind-transaction-controls:
    if: github.head_ref == 'refactor/transaction-explicit-controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/transaction-explicit-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bind transaction controls explicitly
        run: node scripts/bind-transaction-controls-once.js
      - name: Validate repository
        run: npm test
      - name: Commit explicit transaction controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Bind transaction controls explicitly"
          git push origin HEAD:refactor/transaction-explicit-controls
