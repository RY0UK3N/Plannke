name: Canonical desktop shell once

on:
  push:
    branches:
      - feature/storage-adapter-autosave
    paths:
      - '.github/workflows/canonical-desktop-shell-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storage-adapter-autosave
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Promote desktop revamp to canonical shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          root = Path('.')
          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')

          # CSS is now explicit and deterministic from the first paint.
          old_css = '''    <link rel="stylesheet" href="styles.css">\n    <link rel="stylesheet" href="product.css">'''
          new_css = '''    <link rel="stylesheet" href="styles.css">\n    <link rel="stylesheet" href="revamp.css" data-plannke-revamp-style="true">\n    <link rel="stylesheet" href="revamp-dashboard.css">\n    <link rel="stylesheet" href="revamp-movements.css">\n    <link rel="stylesheet" href="revamp-planning.css">\n    <link rel="stylesheet" href="revamp-accounts.css">\n    <link rel="stylesheet" href="revamp-forms.css">\n    <link rel="stylesheet" href="revamp-states.css">\n    <link rel="stylesheet" href="revamp-desktop.css" data-plannke-desktop-style="true">\n    <link rel="stylesheet" href="storage-ui.css" data-plannke-storage-ui="true">\n    <link rel="stylesheet" href="product.css">'''
          if old_css not in index:
              raise SystemExit('CSS anchor not found')
          index = index.replace(old_css, new_css, 1)

          # Remove the old visual chrome completely.
          index, count = re.subn(r'\n    <nav class="navbar sticky-top planner-nav">.*?\n    </nav>\n', '\n', index, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('legacy navbar not found')

          lines = []
          for line in index.splitlines():
              if '<button class="fab-btn"' in line:
                  continue
              if 'id="welcomeModal"' in line:
                  continue
              if 'id="backupReminderModal"' in line:
                  continue
              if '<nav class="mobile-tab-bar"' in line:
                  continue
              lines.append(line)
          index = '\n'.join(lines) + '\n'

          shell_open = '''<body class="plannke-revamp" data-revamp-version="2" data-plannke-canonical="desktop">\n    <div class="revamp-shell" id="revamp-shell">\n        <aside class="revamp-sidebar" id="revamp-sidebar">\n            <div class="revamp-brand">\n                <div class="revamp-brand-mark">P</div>\n                <div class="revamp-brand-copy"><strong>Plannke</strong><span>Central financeira</span></div>\n            </div>\n            <nav class="revamp-nav" aria-label="Navegação principal">\n                <button type="button" class="revamp-nav-item active" data-target="dashboard" aria-label="Início" aria-current="page"><i class="ph ph-house"></i><span class="revamp-nav-label">Início</span></button>\n                <button type="button" class="revamp-nav-item" data-target="movimentacao" aria-label="Movimentações"><i class="ph ph-arrows-left-right"></i><span class="revamp-nav-label">Movimentações</span></button>\n                <button type="button" class="revamp-nav-item" data-target="projecao" aria-label="Planejamento"><i class="ph ph-target"></i><span class="revamp-nav-label">Planejamento</span></button>\n                <button type="button" class="revamp-nav-item" data-target="accounts" aria-label="Contas e cartões"><i class="ph ph-wallet"></i><span class="revamp-nav-label">Contas e cartões</span></button>\n                <button type="button" class="revamp-nav-item" data-target="backup" aria-label="Dados"><i class="ph ph-database"></i><span class="revamp-nav-label">Dados</span></button>\n            </nav>\n            <div class="revamp-sidebar-spacer"></div>\n            <div class="revamp-local-status" title="As alterações são salvas automaticamente neste dispositivo."><i class="ph ph-shield-check"></i><span>Salvo localmente</span></div>\n            <button type="button" class="revamp-settings" onclick="openSettingsPanel()" aria-label="Configurações"><i class="ph ph-gear"></i><span>Configurações</span></button>\n        </aside>\n        <div class="revamp-content" id="revamp-content">\n            <header class="revamp-topbar" id="revamp-topbar">\n                <div class="revamp-topbar-copy">\n                    <span class="revamp-page-eyebrow" id="revamp-page-eyebrow">Visão financeira</span>\n                    <h1 class="revamp-page-title" id="revamp-page-title">Seu dinheiro, com contexto</h1>\n                    <p class="revamp-page-subtitle" id="revamp-page-subtitle">Saldo, compromissos e próximos passos em uma única visão.</p>\n                </div>\n                <div class="revamp-topbar-actions">\n                    <button type="button" class="revamp-primary-action" onclick="openTxModal(null)"><i class="ph ph-plus"></i><span>Nova movimentação</span></button>\n                </div>\n            </header>'''
          if '<body>\n' not in index:
              raise SystemExit('body anchor not found')
          index = index.replace('<body>\n', shell_open + '\n', 1)

          close_anchor = '    </main>\n\n    <div id="toast-container"'
          close_replacement = '            </main>\n        </div>\n    </div>\n\n    <div id="toast-container"'
          if close_anchor not in index:
              raise SystemExit('main close anchor not found')
          index = index.replace(close_anchor, close_replacement, 1)

          old_scripts = '''    <script src="storage.js"></script>\n    <script src="app.js"></script>\n    <script src="ui-bridge.js" data-plannke-ui-bridge="true"></script>\n    <script src="safe-renderers.js"></script>\n    <script src="product-core.js"></script>\n    <script src="product.js"></script>'''
          new_scripts = '''    <script src="storage.js"></script>\n    <script src="app.js"></script>\n    <script src="storage-adapter.js" data-plannke-storage-adapter="true"></script>\n    <script src="storage-ui.js" data-plannke-storage-ui="true"></script>\n    <script src="ui-bridge.js" data-plannke-ui-bridge="true"></script>\n    <script src="safe-renderers.js"></script>\n    <script src="product-core.js"></script>\n    <script src="product.js"></script>\n    <script src="revamp.js" data-plannke-revamp="desktop"></script>\n    <script src="revamp-desktop.js" data-plannke-desktop="true"></script>'''
          if old_scripts not in index:
              raise SystemExit('script anchor not found')
          index = index.replace(old_scripts, new_scripts, 1)
          index_path.write_text(index, encoding='utf-8')

          # product.css is no longer responsible for boot hiding or importing the shell.
          product_css = (root / 'product.css').read_text(encoding='utf-8')
          marker = '/* Product layer: simpler decision-first experience */'
          if marker not in product_css:
              raise SystemExit('product css marker not found')
          product_css = product_css[product_css.index(marker):]
          (root / 'product.css').write_text(product_css, encoding='utf-8')

          # Eliminate nested CSS import duplication now that index owns the full stack.
          for name in ['revamp-accounts.css', 'revamp-forms.css']:
              p = root / name
              text = p.read_text(encoding='utf-8')
              text = re.sub(r"^@import url\('[^']+'\);\s*", '', text, count=1)
              p.write_text(text, encoding='utf-8')

          # Static shell exists from HTML; dynamic builder becomes fallback only.
          revamp_path = root / 'revamp.js'
          revamp = revamp_path.read_text(encoding='utf-8')
          revamp = revamp.replace("label: 'Backup',\n            icon: 'ph-floppy-disk',\n            eyebrow: 'Memory Card',\n            title: 'Backup e importação',\n            subtitle: 'Leve seus dados com você e importe extratos sem conectar seu banco.'", "label: 'Dados',\n            icon: 'ph-database',\n            eyebrow: 'Dados locais',\n            title: 'Dados e importação',\n            subtitle: 'Salvamento local, recuperação e importação assistida de extratos.'")
          revamp = revamp.replace("make('span', '', 'Finanças pessoais')", "make('span', '', 'Central financeira')")
          revamp = revamp.replace("        if (document.getElementById('revamp-shell')) return;", "        const existingShell = document.getElementById('revamp-shell');\n        if (existingShell) {\n            document.body.classList.add('plannke-revamp');\n            document.body.dataset.revampVersion = '2';\n            document.body.dataset.plannkeCanonical = 'desktop';\n            return existingShell;\n        }")
          revamp_path.write_text(revamp, encoding='utf-8')

          # UI bridge is compatibility only; it no longer turns the revamp on.
          bridge_path = root / 'ui-bridge.js'
          bridge = bridge_path.read_text(encoding='utf-8')
          bridge = bridge.replace('        loadRevampAssets();\n', '')
          bridge_path.write_text(bridge, encoding='utf-8')

          # Installed PWA must prefer the current local runtime and only fall back offline.
          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8').replace("plannke-shell-v24", "plannke-shell-v25")
          old_local = '''  if (url.origin === self.location.origin) {\n    event.respondWith(\n      caches.match(event.request).then(cached => {\n        const refresh = fetch(event.request).then(response => {\n          const copy = response.clone();\n          caches.open(CACHE_NAME).then(cache => cache.put(event.request, copy));\n          return response;\n        }).catch(() => cached);\n        return cached || refresh;\n      })\n    );\n    return;\n  }'''
          new_local = '''  if (url.origin === self.location.origin) {\n    event.respondWith(\n      fetch(event.request)\n        .then(response => {\n          const copy = response.clone();\n          caches.open(CACHE_NAME).then(cache => cache.put(event.request, copy));\n          return response;\n        })\n        .catch(() => caches.match(event.request))\n    );\n    return;\n  }'''
          if old_local not in sw:
              raise SystemExit('service worker local strategy anchor not found')
          sw = sw.replace(old_local, new_local, 1)
          sw_path.write_text(sw, encoding='utf-8')

          # Stable PWA identity and desktop shell colors.
          manifest_path = root / 'manifest.webmanifest'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['id'] = './'
          manifest['background_color'] = '#0b0d12'
          manifest['theme_color'] = '#0b0d12'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Update regression tests for the canonical shell contract.
          test_path = root / 'tests/security-shell.test.js'
          test = test_path.read_text(encoding='utf-8')
          start = test.index("test('StorageAdapter is ready before the legacy initApp body is allowed to run'")
          end = test.index("test('bank files are intercepted", start)
          replacement = r'''test('StorageAdapter and canonical desktop runtime are statically loaded before interaction', () => {
  assert.match(index, /<body class="plannke-revamp"[^>]*data-plannke-canonical="desktop"/);
  assert.match(index, /id="revamp-shell"/);
  assert.match(index, /src="storage-adapter\.js" data-plannke-storage-adapter="true"/);
  assert.match(index, /src="storage-ui\.js" data-plannke-storage-ui="true"/);
  assert.match(index, /src="revamp\.js" data-plannke-revamp="desktop"/);
  assert.match(index, /src="revamp-desktop\.js" data-plannke-desktop="true"/);
  assert.ok(index.indexOf('app.js') < index.indexOf('storage-adapter.js'));
  assert.ok(index.indexOf('storage-adapter.js') < index.indexOf('ui-bridge.js'));
  assert.ok(index.indexOf('product.js') < index.indexOf('revamp.js'));
  assert.match(bridge, /function waitForStorageReady\(/);
  assert.match(bridge, /const legacyInitApp = root\?\.initApp/);
  assert.match(bridge, /storageReady[\s\S]*legacyInitApp\.apply/);
  assert.doesNotMatch(bridge, /\n\s*loadRevampAssets\(\);\n/);
  assert.match(storageAdapter, /class LocalStorageAdapter/);
  assert.match(storageAdapter, /class StorageCoordinator/);
});

test('canonical desktop CSS is explicit and legacy application chrome is absent', () => {
  [
    'revamp.css', 'revamp-dashboard.css', 'revamp-movements.css', 'revamp-planning.css',
    'revamp-accounts.css', 'revamp-forms.css', 'revamp-states.css', 'revamp-desktop.css', 'storage-ui.css'
  ].forEach(asset => assert.ok(index.includes(`href="${asset}"`), `missing canonical stylesheet: ${asset}`));
  assert.doesNotMatch(productCss, /@import url\('\.\/revamp/);
  assert.doesNotMatch(index, /class="navbar sticky-top planner-nav"/);
  assert.doesNotMatch(index, /class="fab-btn"/);
  assert.doesNotMatch(index, /class="mobile-tab-bar"/);
  assert.doesNotMatch(index, /id="welcomeModal"/);
  assert.doesNotMatch(index, /id="backupReminderModal"/);
  assert.match(index, /Central financeira/);
  assert.match(index, /revamp-nav-label">Dados</);
});

test('storage status and recovery UI are local and safe', () => {
  assert.match(index, /href="storage-ui\.css" data-plannke-storage-ui="true"/);
  assert.match(index, /src="storage-ui\.js" data-plannke-storage-ui="true"/);
  assert.match(storageUi, /Salvando…/);
  assert.match(storageUi, /Salvo localmente/);
  assert.match(storageUi, /Recuperação local/);
  assert.match(storageUi, /createSnapshot\('manual'\)/);
  assert.match(storageUi, /restoreSnapshot\(snapshot\.id\)/);
  assert.match(storageUi, /before-bank-import/);
  assert.match(storageUiCss, /\.plannke-recovery-panel/);
  assert.doesNotMatch(storageUi, /\.innerHTML\s*=/);
  assert.doesNotMatch(storageUi, /\.outerHTML\s*=/);
  assert.doesNotMatch(storageUi, /insertAdjacentHTML\s*\(/);
  assert.doesNotMatch(storageUi, /\beval\s*\(/);
});

test('storage UI observer cannot recursively rewrite its own status DOM', () => {
  assert.match(storageUi, /function setTextOnce\(/);
  assert.match(storageUi, /node\.textContent !== text/);
  assert.match(storageUi, /function setClassOnce\(/);
  assert.match(storageUi, /function setAttributeOnce\(/);
  assert.match(storageUi, /function scheduleObserverRefresh\(/);
  assert.match(storageUi, /new MutationObserver\(scheduleObserverRefresh\)/);
});

test('canonical revamp remains DOM-safe and dynamic builder is fallback only', () => {
  assert.match(revamp, /const existingShell = document\.getElementById\('revamp-shell'\)/);
  assert.match(revamp, /data\.plannkeCanonical/);
  assert.doesNotMatch(desktop, /\.innerHTML\s*=/);
  assert.doesNotMatch(desktop, /\beval\s*\(/);
  assert.match(desktopCss, /min-width: 1080px/);
});

'''
          test = test[:start] + replacement + test[end:]
          test = test.replace("CACHE_NAME = 'plannke-shell-v24'", "CACHE_NAME = 'plannke-shell-v25'")
          # Assert network-first for static local runtime too.
          insert_anchor = "  assert.ok(navigationBlock.indexOf('fetch(event.request)') < navigationBlock.indexOf(\"caches.match('./index.html')\"));\n"
          insert = insert_anchor + "  const localBlock = sw.slice(sw.indexOf('if (url.origin === self.location.origin)'), sw.indexOf('event.respondWith(\\n    caches.match(event.request)', sw.indexOf('if (url.origin === self.location.origin)')));\n  assert.ok(localBlock.indexOf('fetch(event.request)') < localBlock.indexOf('caches.match(event.request)'));\n"
          if insert_anchor in test:
              test = test.replace(insert_anchor, insert, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Run tests
        run: npm test

      - name: Commit canonical shell and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/canonical-desktop-shell-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make desktop revamp the canonical application shell"
          git push origin HEAD:feature/storage-adapter-autosave
