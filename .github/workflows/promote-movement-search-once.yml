name: Promote movement search once

on:
  push:
    branches:
      - refactor/movements-smart-search

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate migration script
        run: node --check scripts/promote-movement-search-once.js

      - name: Promote movement search
        run: node scripts/promote-movement-search-once.js

      - name: Run full test suite
        run: npm test

      - name: Commit validated extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: move smart search into movements runtime"
          git push
