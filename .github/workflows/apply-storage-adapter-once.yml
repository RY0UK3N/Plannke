name: Apply storage adapter once

on:
  push:
    branches: [feature/storage-adapter-autosave]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storage-adapter-autosave
          fetch-depth: 0
      - name: Integrate StorageAdapter
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text()
          start_marker = "/* ============================================================\n   PERSISTÊNCIA — localStorage (autosave) + prompts"
          end_marker = "/* ============================================================\n   CAMPO DE VALOR FORMATADO"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = """/* ============================================================
   PERSISTÊNCIA — StorageAdapter
   A camada financeira continua síncrona; persistência e migração ficam
   centralizadas em storage-adapter.js.
   ============================================================ */
function loadFromLocalStorage() {
    return globalThis.PlannkeStorage?.initialize();
}

function setupBeforeUnload() {
    // StorageAdapter instala pagehide/flush sem bloquear a saída nem exigir Excel.
    return globalThis.PlannkeStorage?.initialize();
}

function handleExitClick() {
    // Mantido por compatibilidade com handlers legados.
}

"""
          app.write_text(text[:start] + replacement + text[end:])

          index = Path('index.html')
          text = index.read_text()
          needle = '    <script src="app.js"></script>\n'
          insertion = needle + '    <script src="storage-adapter.js"></script>\n'
          if 'src="storage-adapter.js"' not in text:
              text = text.replace(needle, insertion, 1)
          index.write_text(text)

          sw = Path('sw.js')
          text = sw.read_text().replace("plannke-shell-v18", "plannke-shell-v19")
          if "'./storage-adapter.js'" not in text:
              text = text.replace("  './app.js',\n", "  './app.js',\n  './storage-adapter.js',\n", 1)
          sw.write_text(text)

          pkg = Path('package.json')
          text = pkg.read_text()
          if 'node --check storage-adapter.js' not in text:
              text = text.replace('"test": "', '"test": "node --check storage-adapter.js && ', 1)
          pkg.write_text(text)

          security = Path('tests/security-shell.test.js')
          text = security.read_text().replace("plannke-shell-v18", "plannke-shell-v19")
          if "'storage-adapter.js'" not in text:
              text = text.replace(
                  "'revamp.js', 'revamp.css', 'revamp-desktop.js', 'revamp-desktop.css',",
                  "'revamp.js', 'revamp.css', 'storage-adapter.js', 'revamp-desktop.js', 'revamp-desktop.css',",
                  1
              )
          security.write_text(text)

          desktop = Path('revamp-desktop.js')
          text = desktop.read_text()
          text = text.replace("label.textContent !== 'Salvo automaticamente'", "label.textContent !== 'Salvo localmente'")
          text = text.replace("label.textContent = 'Salvo automaticamente'", "label.textContent = 'Salvo localmente'")
          text = text.replace(
              "status.title = 'As alterações são salvas localmente neste dispositivo.';",
              "status.title = 'Persistência local gerenciada pelo StorageAdapter.';"
          )
          bridge = """        /* Temporary bridge until StorageAdapter/SQLite replaces legacy persistence. */
        try {
            if (typeof _backupDone !== 'undefined') _backupDone = true;
        } catch (_) {}

"""
          text = text.replace(bridge, '')
          desktop.write_text(text)

          storage = Path('storage.js')
          text = storage.read_text()
          text = text.replace(
              "STORAGE.JS — Memory Card Engine\n   Dados vivem no Excel (.xlsx). sessionStorage mantém a sessão;\n   app.js espelha a sessão no localStorage como autosave.",
              "STORAGE.JS — Modelo financeiro + fallback legado\n   O runtime desktop usa StorageAdapter; estas rotinas de sessionStorage\n   permanecem como fallback de compatibilidade durante a migração."
          )
          storage.write_text(text)

          workflow = Path('.github/workflows/apply-storage-adapter-once.yml')
          workflow.unlink()
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate StorageAdapter into app runtime"
          git push origin HEAD:feature/storage-adapter-autosave
