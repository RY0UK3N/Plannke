name: Retire app actions once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  retire-app-actions:
    if: github.head_ref == 'refactor/retire-app-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-app-actions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Retire app actions runtime
        run: node scripts/retire-app-actions-once.js
      - name: Validate repository
        run: npm test
      - name: Commit app actions retirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Retire app actions runtime"
          git push origin HEAD:refactor/retire-app-actions
